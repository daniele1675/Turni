# Costruisce l'immagine a ogni modifica e la pubblica su ghcr.io/<tuo-utente>/turni:latest
name: Immagine Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: nome
        run: echo "img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/turni" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ZimaBoard/ZimaCube sono x86. Per un server ARM aggiungi: ,linux/arm64
          platforms: linux/amd64
          tags: ${{ steps.nome.outputs.img }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
